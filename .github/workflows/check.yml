name: check

on:
  push:
  pull_request:

jobs:
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every theme (files, contrast, icons, stale Omarchy 3 files)
        run: python3 tools/check.py
      - name: Lint shell scripts
        run: shellcheck install.sh boot-unlock.sh tools/*.sh hooks/*
